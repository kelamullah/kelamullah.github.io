<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#064e3b" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- 8-Point Rub el Hizb Star -->
  <rect x="25" y="25" width="50" height="50" rx="4" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(0 50 50)"/>
  <rect x="25" y="25" width="50" height="50" rx="4" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(45 50 50)"/>
  <circle cx="50" cy="50" r="14" fill="#047857" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- Calligraphic K / Book emblem -->
  <path d="M42 40 L50 46 L58 40 M50 46 L50 60 M42 40 L42 54 L50 60 L58 54 L58 40" 
        fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
