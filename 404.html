<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kelamullah</title>
  <script>
    var p = window.location.pathname.replace(/^\/+/,'').replace(/\/+$/,'');
    if (p && !/\.(ico|png|jpg|jpeg|svg|json|xml|txt|ttf|woff|woff2|css|js|map)$/i.test(p)) {
      window.location.replace("/#/" + p);
    } else if (!p) {
      window.location.replace("/");
    }
  </script>
</head>
<body></body>
</html>
